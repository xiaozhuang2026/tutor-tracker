<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 辅导班上课记录</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f4ff;--card:#fff;--accent:#4f6ef7;--accent2:#22c55e;--red:#ef4444;--text:#1e293b;--sub:#64748b;--border:#e2e8f0;--radius:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;padding-bottom:80px}
h1{text-align:center;font-size:1.6em;background:linear-gradient(135deg,var(--accent),#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.subtitle{text-align:center;color:var(--sub);font-size:0.85em;margin-bottom:20px}
.child-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.child-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.child-name{font-size:1.2em;font-weight:700}
.child-meta{color:var(--sub);font-size:0.82em;margin-bottom:10px}
.course-item{background:#f8fafc;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.course-header{display:flex;align-items:center;justify-content:space-between}
.course-name{font-weight:600;font-size:0.95em}
.course-count{color:var(--accent);font-weight:700;font-size:1.1em}
.dates{color:var(--sub);font-size:0.78em;margin-top:6px;line-height:1.6}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:10px;font-size:0.9em;cursor:pointer;font-weight:600;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn-primary{background:var(--accent);color:#fff}
.btn-green{background:var(--accent2);color:#fff}
.btn-sm{padding:5px 10px;font-size:0.8em;border-radius:8px}
.btn-danger{background:var(--red);color:#fff}
.btn-outline{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.btn-icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:1em}
.add-btn{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a855f7);color:#fff;font-size:1.8em;border:none;box-shadow:0 4px 16px rgba(79,110,247,0.4);cursor:pointer;z-index:100;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.summary{background:var(--card);border-radius:var(--radius);padding:16px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.summary h3{font-size:1em;margin-bottom:10px;color:var(--sub)}
.summary table{width:100%;border-collapse:collapse;font-size:0.85em}
.summary th{text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--sub);font-weight:600}
.summary td{padding:6px 8px;border-bottom:1px solid var(--border)}
.summary .total-row{font-weight:700;color:var(--accent);background:#f0f4ff}
.screenshot-btn{display:block;width:100%;margin-top:12px;padding:12px;background:var(--card);border:2px dashed var(--border);border-radius:12px;text-align:center;color:var(--sub);font-size:0.9em;cursor:pointer}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:20px;padding:24px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto}
.modal h2{font-size:1.1em;margin-bottom:16px}
.modal label{display:block;font-size:0.85em;color:var(--sub);margin-bottom:4px;margin-top:12px}
.modal input,.modal select{width:100%;padding:10px;border:2px solid var(--border);border-radius:10px;font-size:1em;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.modal-btns .btn{flex:1;text-align:center}
.sync-status{text-align:center;font-size:0.75em;color:var(--sub);margin-top:8px;padding:4px}
.sync-status.ok{color:var(--accent2)}
.sync-status.err{color:var(--red)}
.setup-code{text-align:center;margin:20px 0}
.setup-code input{width:200px;padding:10px;border:2px solid var(--border);border-radius:10px;font-size:1em;text-align:center;font-family:monospace}
.setup-code .hint{font-size:0.75em;color:var(--sub);margin-top:6px}
.empty{color:var(--sub);font-size:0.85em;padding:20px 0;text-align:center}
</style>
</head>
<body>
<h1>📚 辅导班上课记录</h1>
<p class="subtitle">轻松记录 · 家人同步 · 一目了然</p>

<div id="app"></div>

<div class="modal-overlay" id="childModal">
<div class="modal">
<h2 id="childModalTitle">添加孩子</h2>
<label>姓名</label>
<input id="childName" placeholder="如：小明">
<label>年龄</label>
<input id="childAge" type="number" placeholder="如：8">
<label>年级</label>
<input id="childGrade" placeholder="如：二年级">
<div class="modal-btns">
<button class="btn btn-outline" onclick="closeModal('childModal')">取消</button>
<button class="btn btn-primary" onclick="saveChild()">保存</button>
</div>
</div>
</div>

<div class="modal-overlay" id="courseModal">
<div class="modal">
<h2 id="courseModalTitle">添加课程</h2>
<label>课程名称</label>
<input id="courseName" placeholder="如：数学">
<div class="modal-btns">
<button class="btn btn-outline" onclick="closeModal('courseModal')">取消</button>
<button class="btn btn-green" onclick="saveCourse()">保存</button>
</div>
</div>
</div>

<button class="add-btn" onclick="showAddChild()" title="添加孩子">＋</button>

<script>
var API_BASE='https://api.restful-api.dev/objects';
var STORAGE_KEY='tutor_tracker_id';
var LOCAL_KEY='tutor_tracker_data';
var _data=null;
var _editChildIdx=-1;
var _editCourseChildIdx=-1;
var _editCourseIdx=-1;

function getObjectId(){
  return localStorage.getItem(STORAGE_KEY);
}

function saveObjectId(id){
  localStorage.setItem(STORAGE_KEY,id);
}

function defaultData(){
  return {children:[]};
}

// Load data from cloud
function loadData(){
  var id=getObjectId();
  if(!id){
    // First time - show setup or auto-create
    _data=defaultData();
    render();
    autoSetup();
    return;
  }
  fetch(API_BASE+'/'+id).then(function(r){
    if(!r.ok) throw new Error('not found');
    return r.json();
  }).then(function(obj){
    _data=obj.data||defaultData();
    // Save local backup
    localStorage.setItem(LOCAL_KEY,JSON.stringify(_data));
    setSync('ok','✅ 已同步');
    render();
  }).catch(function(e){
    // Fallback to local
    var local=localStorage.getItem(LOCAL_KEY);
    if(local){
      _data=JSON.parse(local);
      setSync('err','⚠️ 网络不可用，使用本地数据');
    }else{
      _data=defaultData();
    }
    render();
  });
}

// Save data to cloud
function saveData(){
  if(!_data) return;
  localStorage.setItem(LOCAL_KEY,JSON.stringify(_data));
  var id=getObjectId();
  if(!id) return;
  setSync('saving','🔄 同步中...');
  fetch(API_BASE+'/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({data:_data})
  }).then(function(r){
    if(!r.ok) throw new Error('save failed');
    return r.json();
  }).then(function(){
    setSync('ok','✅ 已同步');
  }).catch(function(e){
    setSync('err','⚠️ 同步失败，数据已保存在本地');
  });
}

function autoSetup(){
  // Auto-create cloud object
  setSync('saving','🔄 初始化云端...');
  fetch(API_BASE,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({data:defaultData()})
  }).then(function(r){return r.json();}).then(function(obj){
    saveObjectId(obj.id);
    setSync('ok','✅ 云端已就绪');
  }).catch(function(e){
    setSync('err','⚠️ 云端初始化失败，使用本地存储');
  });
}

function setSync(cls,msg){
  var el=document.getElementById('syncStatus');
  if(el){
    el.className='sync-status '+cls;
    el.textContent=msg;
  }
}

// Render
function render(){
  if(!_data) return;
  var app=document.getElementById('app');
  var html='';

  if(_data.children.length===0){
    html+='<p class="empty">还没有孩子记录\n点击右下角 ＋ 添加第一个孩子</p>';
  }

  _data.children.forEach(function(child,ci){
    html+='<div class="child-card" id="card-'+ci+'">';
    html+='<div class="child-header">';
    html+='<h2 class="child-name">'+esc(child.name)+'</h2>';
    html+='<div>';
    html+='<button class="btn btn-icon btn-sm btn-outline" onclick="showEditChild('+ci+')">✏️</button> ';
    html+='<button class="btn btn-icon btn-sm btn-danger" onclick="deleteChild('+ci+')">🗑️</button>';
    html+='</div></div>';
    html+='<div class="child-meta">🎂 '+esc(child.age||'?')+'岁 🎓 '+esc(child.grade||'')+'</div>';

    if(child.courses.length===0){
      html+='<p class="empty">暂无课程，点击下方"添加课程"</p>';
    }

    child.courses.forEach(function(course,coi){
      html+='<div class="course-item">';
      html+='<div class="course-header">';
      html+='<span class="course-name">📖 '+esc(course.name)+'</span>';
      html+='<div>';
      html+='<span class="course-count">'+course.dates.length+'次</span> ';
      html+='<button class="btn btn-sm btn-outline" onclick="showEditCourse('+ci+','+coi+')">✏️</button> ';
      html+='<button class="btn btn-sm btn-danger" onclick="deleteCourse('+ci+','+coi+')">🗑️</button>';
      html+='</div></div>';
      if(course.dates.length>0){
        html+='<div class="dates">📅 '+course.dates.map(function(d){return esc(d);}).join(' · ')+'</div>';
      }
      html+='<div style="margin-top:8px">';
      html+='<button class="btn btn-sm btn-primary" onclick="addDate('+ci+','+coi+')">＋ 记录上课</button>';
      html+='</div></div>';
    });

    html+='<button class="btn btn-sm btn-outline" style="margin-top:8px" onclick="showAddCourse('+ci+')">＋ 添加课程</button>';
    html+='</div>';
  });

  // Summary
  var total=0;
  html+='<div class="summary" id="summarySection"><h3>📊 汇总一览表</h3><table><tr><th>孩子</th><th>课程</th><th>上课次数</th></tr>';
  _data.children.forEach(function(child){
    child.courses.forEach(function(course){
      total+=course.dates.length;
      html+='<tr><td>'+esc(child.name)+'</td><td>'+esc(course.name)+'</td><td>'+course.dates.length+'次</td></tr>';
    });
  });
  html+='<tr class="total-row"><td>📋 全部总计</td><td></td><td>'+total+'次</td></tr></table></div>';

  html+='<button class="screenshot-btn" onclick="takeScreenshot()">📸 保存长截图</button>';
  html+='<div id="syncStatus" class="sync-status"></div>';

  // Setup code display
  var objId=getObjectId();
  if(objId){
    html+='<div class="setup-code">';
    html+='<div class="hint">家人同步代码（在新设备输入此代码即可同步）</div>';
    html+="<input value='"+objId+"' readonly onclick=\"this.select();document.execCommand(&quot;copy&quot;)\">";
    html+='<div class="hint">点击即复制 · 在其他设备打开网站输入此代码</div>';
    html+='</div>';
  }else{
    html+='<div class="setup-code">';
    html+='<div class="hint">首次使用？输入同步代码加载已有数据</div>';
    html+='<input id="setupInput" placeholder="粘贴同步代码">';
    html+='<button class="btn btn-sm btn-primary" style="margin-top:8px" onclick="importCode()">加载</button>';
    html+='</div>';
  }

  app.innerHTML=html;
}

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Child CRUD
function showAddChild(){
  _editChildIdx=-1;
  document.getElementById('childModalTitle').textContent='添加孩子';
  document.getElementById('childName').value='';
  document.getElementById('childAge').value='';
  document.getElementById('childGrade').value='';
  openModal('childModal');
}

function showEditChild(ci){
  _editChildIdx=ci;
  var c=_data.children[ci];
  document.getElementById('childModalTitle').textContent='编辑孩子';
  document.getElementById('childName').value=c.name;
  document.getElementById('childAge').value=c.age||'';
  document.getElementById('childGrade').value=c.grade||'';
  openModal('childModal');
}

function saveChild(){
  var name=document.getElementById('childName').value.trim();
  if(!name) return;
  var age=document.getElementById('childAge').value.trim();
  var grade=document.getElementById('childGrade').value.trim();
  if(_editChildIdx>=0){
    _data.children[_editChildIdx].name=name;
    _data.children[_editChildIdx].age=age;
    _data.children[_editChildIdx].grade=grade;
  }else{
    _data.children.push({name:name,age:age,grade:grade,courses:[]});
  }
  closeModal('childModal');
  saveData();
  render();
}

function deleteChild(ci){
  if(!confirm('确认删除 '+_data.children[ci].name+' 的所有记录？')) return;
  _data.children.splice(ci,1);
  saveData();
  render();
}

// Course CRUD
function showAddCourse(ci){
  _editCourseChildIdx=ci;
  _editCourseIdx=-1;
  document.getElementById('courseModalTitle').textContent='添加课程';
  document.getElementById('courseName').value='';
  openModal('courseModal');
}

function showEditCourse(ci,coi){
  _editCourseChildIdx=ci;
  _editCourseIdx=coi;
  document.getElementById('courseModalTitle').textContent='编辑课程';
  document.getElementById('courseName').value=_data.children[ci].courses[coi].name;
  openModal('courseModal');
}

function saveCourse(){
  var name=document.getElementById('courseName').value.trim();
  if(!name) return;
  if(_editCourseIdx>=0){
    _data.children[_editCourseChildIdx].courses[_editCourseIdx].name=name;
  }else{
    _data.children[_editCourseChildIdx].courses.push({name:name,dates:[]});
  }
  closeModal('courseModal');
  saveData();
  render();
}

function deleteCourse(ci,coi){
  if(!confirm('确认删除 '+_data.children[ci].courses[coi].name+'？')) return;
  _data.children[ci].courses.splice(coi,1);
  saveData();
  render();
}

// Add date
function addDate(ci,coi){
  var today=new Date().toISOString().split('T')[0];
  var d=prompt('输入上课日期（YYYY-MM-DD）：',today);
  if(!d) return;
  d=d.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){
    alert('日期格式不对，请用 2024-01-15 这样的格式');
    return;
  }
  _data.children[ci].courses[coi].dates.push(d);
  _data.children[ci].courses[coi].dates.sort();
  saveData();
  render();
}

// Import sync code
function importCode(){
  var input=document.getElementById('setupInput');
  var code=input.value.trim();
  if(!code) return;
  saveObjectId(code);
  loadData();
}

// Screenshot
function takeScreenshot(){
  var target=document.getElementById('app');
  html2canvas(target,{scale:2,backgroundColor:'#f0f4ff',useCORS:true}).then(function(canvas){
    var link=document.createElement('a');
    link.download='辅导班记录_'+new Date().toISOString().split('T')[0]+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
  }).catch(function(e){
    alert('截图失败: '+e.message);
  });
}

// Modal helpers
function openModal(id){
  document.getElementById(id).classList.add('active');
}
function closeModal(id){
  document.getElementById(id).classList.remove('active');
}

// Init
loadData();
</script>
</body>
</html>
